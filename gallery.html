<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图提取 · 图片画廊</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <!-- ============ 顶部栏 ============ -->
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm1 12h14l-4.5-6-3.5 4.5-2.5-3L5 17Z" fill="currentColor"/>
          <circle cx="8.5" cy="9" r="1.6" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand-text">图提取 <em>ImageGrab</em></span>
    </div>
    <p class="page-info" id="page-info">正在读取图片…</p>
  </header>

  <!-- ============ 工具栏 ============ -->
  <section class="toolbar" id="toolbar" hidden>
    <div class="toolbar-left">
      <button type="button" class="btn btn-ghost" id="btn-all">全选</button>
      <button type="button" class="btn btn-ghost" id="btn-invert">反选</button>
      <button type="button" class="btn btn-ghost" id="btn-none">全不选</button>
      <span class="divider" aria-hidden="true"></span>
      <label class="min-size">
        隐藏小于
        <select id="min-size">
          <option value="0">不限</option>
          <option value="200">200px</option>
          <option value="400">400px</option>
          <option value="600">600px</option>
          <option value="800">800px</option>
        </select>
      </label>
    </div>
    <div class="toolbar-right">
      <span class="count" id="count">已选 <strong>0</strong> / 0 张</span>
      <button type="button" class="btn btn-primary" id="btn-download" disabled>
        下载选中
      </button>
    </div>
  </section>

  <!-- ============ 下载进度 ============ -->
  <section class="progress" id="progress" hidden>
    <div class="progress-bar"><span id="progress-fill"></span></div>
    <p class="progress-text" id="progress-text">准备中…</p>
  </section>

  <!-- ============ 空状态 ============ -->
  <section class="empty" id="empty" hidden>
    <div class="empty-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="48" height="48">
        <path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm1 12h14l-4.5-6-3.5 4.5-2.5-3L5 17Z" fill="currentColor"/>
        <circle cx="8.5" cy="9" r="1.6" fill="currentColor"/>
      </svg>
    </div>
    <h2>还没有提取到图片</h2>
    <p>请回到电商商品详情页，点击右下角的「获取图片」按钮。</p>
  </section>

  <!-- ============ 图片网格 ============ -->
  <main class="grid" id="grid" aria-live="polite"></main>

  <!-- ============ 轻提示 ============ -->
  <div class="toast" id="toast" role="status"></div>

  <script src="gallery.js"></script>
</body>
</html>
